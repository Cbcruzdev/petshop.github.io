<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento - Amigo Pet</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">

            <h1>Amigo Pet</h1>

            <nav>
                <a href="index.html">Início</a>
                <a href="produtos.html">Produtos</a>
                <a href="servicos.html">Serviços</a>
                <a href="cadastro.html">Cadastro</a>
                <a href="agendamento.html">Agendamento</a>
            </nav>

        </div>
    </header>


    <main>

        <div class="container formulario">

            <h2 class="mt-4 mb-4">
                Agendamento
            </h2>

            <p>
                Escolha o serviço, a forma de atendimento,
                a data e o horário.
            </p>


            <form onsubmit="confirmarAgendamento(); return false;">

                <!-- Escolha do serviço -->
                <fieldset class="mb-4">

                    <legend class="fs-5">
                        Escolha o serviço:
                    </legend>

                    <div class="form-check">

                        <input
                            type="radio"
                            class="form-check-input"
                            id="banho"
                            name="servico"
                            value="banho"
                            required>

                        <label
                            for="banho"
                            class="form-check-label">

                            Banho

                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            type="radio"
                            class="form-check-input"
                            id="tosa"
                            name="servico"
                            value="tosa">

                        <label
                            for="tosa"
                            class="form-check-label">

                            Tosa

                        </label>

                    </div>

                </fieldset>


                <!-- Forma de atendimento -->
                <fieldset class="mb-4">

                    <legend class="fs-5">
                        Forma de atendimento:
                    </legend>

                    <div class="form-check">

                        <input
                            type="radio"
                            class="form-check-input"
                            id="telebusca"
                            name="atendimento"
                            value="tele-busca"
                            required>

                        <label
                            for="telebusca"
                            class="form-check-label">

                            Tele-busca

                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            type="radio"
                            class="form-check-input"
                            id="entrega"
                            name="atendimento"
                            value="entrega-local">

                        <label
                            for="entrega"
                            class="form-check-label">

                            Entrega do pet no local

                        </label>

                    </div>

                </fieldset>


                <!-- Data -->
                <div class="mb-3">

                    <label
                        for="data"
                        class="form-label">

                        Escolha a data:

                    </label>

                    <input
                        type="date"
                        class="form-control"
                        id="data"
                        name="data"
                        required>

                </div>


                <!-- Horário -->
                <div class="mb-3">

                    <label
                        for="horario"
                        class="form-label">

                        Escolha o horário:

                    </label>

                    <input
                        type="time"
                        class="form-control"
                        id="horario"
                        name="horario"
                        required>

                </div>


                <!-- Observações -->
                <div class="mb-3">

                    <label
                        for="observacoes"
                        class="form-label">

                        Observações:

                    </label>

                    <textarea
                        class="form-control"
                        id="observacoes"
                        name="observacoes"
                        placeholder="Digite alguma observação sobre o atendimento"
                        rows="4">
                    </textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Confirmar agendamento

                </button>

            </form>

        </div>

    </main>


    <footer>

        <div class="container">

            <p>
                Amigo Pet - Projeto acadêmico da disciplina
                Fundamentos de Sistemas Web.
            </p>

            <p>
                Contato: contato@amigopet.com
            </p>

        </div>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript do projeto -->
    <script src="js/script.js"></script>

</body>

</html>
