<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Amigo Pet</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">

            <h1>Amigo Pet</h1>

            <nav>
                <a href="index.html">Início</a>
                <a href="produtos.html">Produtos</a>
                <a href="servicos.html">Serviços</a>
                <a href="cadastro.html">Cadastro</a>
                <a href="agendamento.html">Agendamento</a>
            </nav>

        </div>
    </header>


    <main>

        <div class="container formulario">

            <h2 class="mt-4 mb-4">
                Cadastro do Cliente e do Pet
            </h2>

            <form onsubmit="confirmarCadastro(); return false;">

                <!-- Dados do cliente -->
                <h3>Dados do Cliente</h3>

                <div class="mb-3">

                    <label for="nome" class="form-label">
                        Nome completo:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required>

                </div>


                <div class="mb-3">

                    <label for="endereco" class="form-label">
                        Endereço:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="endereco"
                        name="endereco"
                        placeholder="Digite seu endereço"
                        required>

                </div>


                <div class="mb-3">

                    <label for="cpf" class="form-label">
                        CPF:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        required>

                </div>


                <div class="mb-3">

                    <label for="telefone" class="form-label">
                        Telefone:
                    </label>

                    <input
                        type="tel"
                        class="form-control"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        required>

                </div>


                <div class="mb-3">

                    <label for="email" class="form-label">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="seuemail@email.com"
                        required>

                </div>


                <!-- Sexo -->
                <fieldset class="mb-3">

                    <legend class="fs-5">
                        Sexo:
                    </legend>

                    <div class="form-check">

                        <input
                            type="radio"
                            class="form-check-input"
                            id="feminino"
                            name="sexo"
                            value="feminino"
                            required>

                        <label
                            for="feminino"
                            class="form-check-label">

                            Feminino

                        </label>

                    </div>


                    <div class="form-check">

                        <input
                            type="radio"
                            class="form-check-input"
                            id="masculino"
                            name="sexo"
                            value="masculino">

                        <label
                            for="masculino"
                            class="form-check-label">

                            Masculino

                        </label>

                    </div>

                </fieldset>


                <hr>


                <!-- Dados do pet -->
                <h3>Dados do Pet</h3>


                <div class="mb-3">

                    <label for="nomePet" class="form-label">
                        Nome do pet:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nomePet"
                        name="nomePet"
                        placeholder="Digite o nome do pet"
                        required>

                </div>


                <div class="mb-3">

                    <label for="raca" class="form-label">
                        Raça:
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="raca"
                        name="raca"
                        placeholder="Digite a raça do pet"
                        required>

                </div>


                <div class="mb-3">

                    <label for="idade" class="form-label">
                        Idade:
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="idade"
                        name="idade"
                        min="0"
                        max="30"
                        placeholder="Digite a idade"
                        required>

                </div>


                <div class="mb-3">

                    <label for="animal" class="form-label">
                        Tipo de animal:
                    </label>

                    <select
                        id="animal"
                        name="animal"
                        class="form-select"
                        required>

                        <option value="">
                            Selecione uma opção
                        </option>

                        <option value="cao">
                            Cão
                        </option>

                        <option value="gato">
                            Gato
                        </option>

                    </select>

                </div>


                <!-- Checkbox -->
                <div class="form-check mb-3">

                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="termos"
                        name="termos"
                        required>

                    <label
                        for="termos"
                        class="form-check-label">

                        Concordo com o cadastro dos meus dados.

                    </label>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">

                    Cadastrar

                </button>

            </form>

        </div>

    </main>


    <footer>

        <div class="container">

            <p>
                Amigo Pet - Projeto acadêmico da disciplina
                Fundamentos de Sistemas Web.
            </p>

            <p>
                Contato: contato@amigopet.com
            </p>

        </div>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript do projeto -->
    <script src="js/script.js"></script>

</body>

</html>
